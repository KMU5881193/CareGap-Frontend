name: Flutter verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Synthetic UI configuration only; CI never calls the live AI server.
      - run: flutter build apk --debug --dart-define=USE_MOCK=true
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
